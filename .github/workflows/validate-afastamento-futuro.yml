name: Validate future Afastamento (no production)
on:
  push:
    branches:
      - feat/afastamento-futuro-20261127
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Confirm SQL was not executed
        run: |
          test -f supabase/migrations/20261127100000_permite_afastamento_futuro.sql
          echo "Migration prepared only; no database changes"
