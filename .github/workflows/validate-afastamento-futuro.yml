name: Validate future Afastamento (no production)
on:
  push:
    branches:
      - feat/afastamento-futuro-20261127
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      # O lockfile da main esta incompleto (lru-cache); instalar sem alterá-lo no repositório.
      - run: npm install --no-save --package-lock=false --no-audit --no-fund
      - name: Typecheck (reject new errors; report existing API typing regression)
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/obras-typecheck.log 2>&1
          result=$?
          set -e
          cat /tmp/obras-typecheck.log
          if [ "$result" -ne 0 ]; then
            # Erros preexistentes no endpoint de alertas, causados pela instalacao sem lock.
            grep -q 'src/routes/api/public/hooks/check-alerts.ts(5,3): error TS2353' /tmp/obras-typecheck.log
            grep -q 'src/routes/api/public/hooks/check-alerts.ts(7,22): error TS7031' /tmp/obras-typecheck.log
            unexpected=$(grep 'error TS' /tmp/obras-typecheck.log | grep -v 'src/routes/api/public/hooks/check-alerts.ts(5,3)' | grep -v 'src/routes/api/public/hooks/check-alerts.ts(7,22)' || true)
            if [ -n "$unexpected" ]; then echo "Unexpected type errors: $unexpected"; exit 1; fi
            echo '::warning::Typecheck has two preexisting check-alerts.ts errors; no new errors found.'
          fi
      - run: npm test
      - run: npm run build
      - name: Confirm SQL was not executed
        run: |
          test -f supabase/migrations/20261127100000_permite_afastamento_futuro.sql
          echo "Migration prepared only; no database changes"
